name: Validate and publish renderer BETA packs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  beta-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build beta data packs
        run: python3 tools/build_beta_packs.py
      - name: Audit all packages and catalogue
        run: |
          python3 tools/validate_catalog.py
          for pkg in dist/*.n179r; do python3 tools/validate_pack.py "$pkg"; done
          python3 tools/verify_beta_assets.py
      - name: Publish explicitly labelled pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=beta-v0.1.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.n179r --clobber
          else
            gh release create "$TAG" dist/*.n179r --prerelease --target "$GITHUB_SHA" \
              --title "Renderer data packs BETA v0.1.0 (LIMITED)" \
              --notes "Data-only layout profiles for n179. Supports OOXML DOCX/XLSX/PPTX limited renderer in Cetak n179 v0.1.104+. NOT an APK, NOT full Office compatibility, NOT physical-verified."
          fi
