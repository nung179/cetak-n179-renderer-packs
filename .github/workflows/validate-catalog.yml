name: Validate Public Renderer Repository
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate catalog metadata
        run: python tools/validate_catalog.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
